services:
  - type: web
    name: mediroute-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      # Never commit this value. It was previously written here with `value:`,
      # which published the production signing key to the repository and its
      # history, allowing anyone who read it to mint a valid admin token.
      # generateValue has Render create a strong secret and keep it out of git.
      #
      # The leaked key must still be rotated in the Render dashboard: removing
      # it here does not remove it from earlier commits.
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MAPBOX_TOKEN
        sync: false
      - key: CLIENT_URL
        value: https://mediroute-five.vercel.app
