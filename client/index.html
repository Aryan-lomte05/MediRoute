<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MediRoute — Next-Gen Intelligent Emergency Response & Dynamic Hospital Allocation System powered by AI" />
    <meta name="theme-color" content="#FF2D4A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MediRoute" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS ignores the web manifest for the home-screen icon, so the
         raster icon has to be declared here or an install shows a blank tile. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>MediRoute — AI Emergency Response</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!--
      Mapbox GL's stylesheet is imported by the pages that render a map, so it
      ships in the map chunk and loads only on those routes. A CDN <link> here
      was a render-blocking request on every route, including the public
      emergency page, which draws no map at all.
    -->
  </head>
  <body class="bg-[#0a0a0f]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
